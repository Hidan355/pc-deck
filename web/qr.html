<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PC Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #eef1f7; font-family: 'Outfit', system-ui, sans-serif; }
  .card { background: #141822; border: 1px solid rgba(255,255,255,.08); border-radius: 28px; padding: 36px 40px; text-align: center; max-width: 420px; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p { color: #8a93a6; margin: 0 0 24px; line-height: 1.5; }
  #qr { background: #fff; padding: 16px; border-radius: 18px; display: inline-block; }
  #qr img, #qr canvas { display: block; }
  .url { margin-top: 20px; font-size: 13px; color: #8a93a6; word-break: break-all; }
  .url b { color: #eef1f7; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1 id="h"></h1>
  <p id="p"></p>
  <div id="qr"></div>
  <div class="url"><span id="u"></span><br><b>{{URL}}</b></div>
</div>
<script>
  const EN = /^(pt|en)$/.test('{{LANG}}') ? '{{LANG}}' === 'en' : !navigator.language.toLowerCase().startsWith('pt');
  const T = EN
    ? { title: 'PC Deck - connect phone', h: 'Connect your phone', p: 'With the phone on the same Wi-Fi as the PC,<br>point the camera at the code.', u: 'or type in the phone browser:' }
    : { title: 'PC Deck - conectar celular', h: 'Conectar o celular', p: 'Com o celular no mesmo Wi-Fi do PC,<br>aponte a câmera para o código.', u: 'ou digite no navegador do celular:' };
  document.documentElement.lang = EN ? 'en' : 'pt-BR';
  document.title = T.title;
  document.getElementById('h').textContent = T.h;
  document.getElementById('p').innerHTML = T.p;
  document.getElementById('u').textContent = T.u;
  new QRCode(document.getElementById('qr'), { text: '{{URL}}', width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
</script>
</body>
</html>
