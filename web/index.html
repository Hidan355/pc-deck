<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>PC Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block" rel="stylesheet">
<style>
:root {
  --bg: #0b0d12;
  --panel: #141822;
  --tile: #181d29;
  --line: rgba(255,255,255,.07);
  --text: #eef1f7;
  --dim: #8a93a6;
  --acc: #7c5cff;
  --ok: #1ed760;
  --bad: #f43f5e;
  --r: 22px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background:
    radial-gradient(900px 500px at 0% -10%, rgba(124,92,255,.22), transparent 60%),
    radial-gradient(700px 500px at 110% 110%, rgba(56,189,248,.12), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: 'Outfit', system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.ms {
  font-family: 'Material Symbols Rounded';
  font-weight: normal; font-style: normal; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap;
  direction: ltr; -webkit-font-smoothing: antialiased;
  font-feature-settings: 'liga';
  display: inline-block; overflow: hidden;
}

.app {
  height: 100dvh;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}

/* ---- topo ---- */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.clock { display: flex; flex-direction: column; }
.clock .t { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.clock .d { font-size: 13px; color: var(--dim); margin-top: 4px; }
.stats { display: flex; gap: 8px; }
.chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 11px 7px 9px; font-size: 13px; font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.chip .ms { font-size: 17px; color: var(--dim); }
.chip .bar { width: 26px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.chip .bar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .6s; }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.iconbtn .ms { font-size: 20px; color: var(--dim); }

/* ---- tocando agora ---- */
.now {
  display: grid; grid-template-columns: 64px 1fr; gap: 12px 14px; align-items: center;
  background: linear-gradient(135deg, rgba(124,92,255,.16), rgba(20,24,34,.9) 55%);
  border: 1px solid var(--line); border-radius: var(--r); padding: 12px;
  position: relative; overflow: hidden;
}
.now .bgart { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) saturate(1.4); opacity: .28; transition: opacity .6s; }
.now > *:not(.bgart) { position: relative; }
.art { width: 64px; height: 64px; border-radius: 14px; background: var(--tile) center/cover; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.art .ms { font-size: 28px; color: var(--dim); }
.art.has .ms { display: none; }
.meta { min-width: 0; }
.meta .ti { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .ar { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.transport { display: flex; gap: 6px; margin-top: 8px; }
.transport button { width: 40px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.06); transition: transform .1s, background .2s; }
.transport button:active { transform: scale(.9); background: rgba(255,255,255,.14); }
.transport .ms { font-size: 22px; }
.transport .play { background: var(--text); color: var(--bg); }
.transport .play:active { background: #fff; }
.vol { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
.vol .mute { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,.06); }
.vol .mute .ms { font-size: 20px; }
.vol .mute.on { background: rgba(244,63,94,.2); color: var(--bad); }
.vol .val { width: 34px; text-align: right; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 34px; background: transparent; margin: 0; --p: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--acc) var(--p), rgba(255,255,255,.1) var(--p)); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--acc) var(--p), rgba(255,255,255,.1) var(--p)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; margin-top: -7px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: #fff; }

/* ---- grade de botoes ---- */
.gridwrap { min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.gridwrap::-webkit-scrollbar { display: none; }
.grid { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 12px; align-content: start; padding: 2px; }
.grid.in { animation: slidein .28s ease; }
.grid.in.rev { animation-name: slideinrev; }
@keyframes slidein { from { opacity: 0; transform: translateX(24px); } }
@keyframes slideinrev { from { opacity: 0; transform: translateX(-24px); } }

.tile {
  --c: var(--acc);
  position: relative; aspect-ratio: 1; border-radius: var(--r);
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 16%, var(--tile)) 0%, var(--tile) 70%);
  border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 10px; overflow: hidden;
  transition: transform .12s ease, box-shadow .2s ease, border-color .2s;
}
.tile .ico { width: 48%; max-width: 58px; aspect-ratio: 1; border-radius: 30%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); }
.tile .ico .ms { font-size: clamp(22px, 7vw, 32px); }
.tile .lbl { font-size: 13px; font-weight: 500; text-align: center; line-height: 1.15; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile.down { transform: scale(.94); border-color: color-mix(in srgb, var(--c) 70%, transparent); box-shadow: 0 0 28px color-mix(in srgb, var(--c) 40%, transparent); }
.tile.ok { animation: ok .5s ease; }
.tile.err { animation: err .45s ease; }
@keyframes ok { 30% { box-shadow: 0 0 0 2px var(--ok), 0 0 30px rgba(30,215,96,.45); } }
@keyframes err { 20%, 60% { transform: translateX(-5px); box-shadow: 0 0 0 2px var(--bad); } 40%, 80% { transform: translateX(5px); } }
.tile .lock { position: absolute; top: 9px; right: 10px; font-size: 15px; color: var(--dim); opacity: .7; }
.tile .fill { position: absolute; inset: 0; background: color-mix(in srgb, var(--c) 35%, transparent); transform: scaleY(0); transform-origin: bottom; pointer-events: none; }
.tile.hold .fill { transform: scaleY(1); transition: transform .7s linear; }

/* ---- abas ---- */
nav { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 5px; }
nav button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 6px; border-radius: 13px; color: var(--dim); font-size: 13px; font-weight: 500; transition: background .2s, color .2s; min-width: 0; }
nav button .ms { font-size: 20px; }
nav button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav button.on { background: rgba(124,92,255,.18); color: var(--text); }
nav button.on .ms { color: var(--acc); }

/* ---- paisagem ---- */
@media (orientation: landscape) {
  .app { grid-template-columns: minmax(250px, 34%) 1fr; grid-template-rows: auto 1fr auto; column-gap: 16px; }
  header { grid-column: 1; grid-row: 1; }
  .now { grid-column: 1; grid-row: 2; align-self: start; }
  .gridwrap { grid-column: 2; grid-row: 1 / 3; }
  nav { grid-column: 1 / -1; }
  .grid { grid-template-columns: repeat(var(--cols-l, 5), 1fr); }
  .tile .ico .ms { font-size: clamp(22px, 4vw, 30px); }
}
@media (orientation: landscape) and (max-height: 430px) {
  .app { gap: 8px; }
  nav button { padding: 7px 6px; }
  header { flex-wrap: wrap; row-gap: 8px; }
  .clock { flex-direction: row; align-items: baseline; gap: 10px; }
  .clock .t { font-size: 26px; }
  .clock .d { margin: 0; white-space: nowrap; }
  .tile { aspect-ratio: auto; min-height: 96px; gap: 7px; }
  .tile .ico { width: 44px; }
}
@media (orientation: portrait) and (max-width: 420px) {
  nav button:not(.on) span:last-child { display: none; }
}

/* ---- player so aparece tocando: sem ele, a grade ocupa o espaco ---- */
.app.noplayer .now { display: none; }
.app.noplayer { grid-template-rows: auto 1fr auto; }
@media (orientation: landscape) {
  .app.noplayer { grid-template-columns: 1fr; }
  .app.noplayer header { grid-column: 1; grid-row: 1; }
  .app.noplayer .gridwrap { grid-column: 1; grid-row: 2; }
  .app.noplayer nav { grid-column: 1; grid-row: 3; }
}
.now.pop { animation: nowin .35s ease; }
@keyframes nowin { from { opacity: 0; transform: translateY(-8px) scale(.98); } }

/* ---- aviso / toast ---- */
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: #222838; border: 1px solid var(--line); padding: 10px 16px; border-radius: 14px; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; max-width: 90vw; text-align: center; z-index: 10; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { border-color: rgba(244,63,94,.5); }
.offline { position: fixed; top: 0; left: 0; right: 0; background: var(--bad); color: #fff; text-align: center; font-size: 13px; padding: 4px; transform: translateY(-100%); transition: .3s; z-index: 10; }
.offline.show { transform: none; }
.locked { position: fixed; inset: 0; background: var(--bg); display: none; place-items: center; text-align: center; padding: 30px; z-index: 20; }
.locked.show { display: grid; }
.locked .ms { font-size: 54px; color: var(--acc); }
.locked h2 { margin: 12px 0 6px; }
.locked p { color: var(--dim); margin: 0; line-height: 1.5; }
code { background: var(--panel); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<div class="app noplayer" id="app">
  <header>
    <div class="clock" id="clock"><div class="t" id="time">--:--</div><div class="d" id="date"></div></div>
    <div class="stats">
      <div class="chip"><span class="ms">memory</span><span id="cpu">--%</span><span class="bar"><i id="cpub"></i></span></div>
      <div class="chip"><span class="ms">memory_alt</span><span id="ram">--%</span><span class="bar"><i id="ramb"></i></span></div>
      <button class="iconbtn" id="fs" data-i18n-title="Tela cheia"><span class="ms">fullscreen</span></button>
    </div>
  </header>

  <section class="now">
    <div class="bgart" id="bgart"></div>
    <div class="art" id="art"><span class="ms">music_note</span></div>
    <div class="meta">
      <div class="ti" id="title" data-i18n>Nada tocando</div>
      <div class="ar" id="artist">—</div>
      <div class="transport">
        <button data-media="prev"><span class="ms">skip_previous</span></button>
        <button data-media="play_pause" class="play"><span class="ms" id="playico">play_arrow</span></button>
        <button data-media="next"><span class="ms">skip_next</span></button>
      </div>
    </div>
    <div class="vol">
      <button class="mute" id="mute"><span class="ms" id="muteico">volume_up</span></button>
      <input type="range" id="vol" min="0" max="100" value="50">
      <span class="val" id="volv">--</span>
    </div>
  </section>

  <div class="gridwrap" id="gridwrap"><div class="grid" id="grid"></div></div>

  <nav id="tabs"></nav>
</div>

<div class="toast" id="toast"></div>
<div class="offline" id="offline" data-i18n>Sem conexão com o PC</div>
<div class="locked" id="locked">
  <div>
    <span class="ms">phonelink_lock</span>
    <h2 data-i18n>Conecte ao PC</h2>
    <p id="lockedHelp"></p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// ---------- idioma (o servidor troca {{LANG}} por pt ou en) ----------
const LANG = /^(pt|en)$/.test('{{LANG}}') ? '{{LANG}}' : (navigator.language.toLowerCase().startsWith('pt') ? 'pt' : 'en');
const LOCALE = LANG === 'en' ? 'en-US' : 'pt-BR';
const EN = {
  'Tela cheia': 'Full screen',
  'Nada tocando': 'Nothing playing',
  'Sem conexão com o PC': 'No connection to the PC',
  'Conecte ao PC': 'Connect to the PC',
  'No PC, clique no ícone do <b>PC Deck</b> perto do relógio,<br>escolha <b>Conectar celular</b> e escaneie o QR code.':
    'On the PC, click the <b>PC Deck</b> icon near the clock,<br>choose <b>Connect phone</b> and scan the QR code.',
  'Sem acesso': 'No access',
  'Erro': 'Error',
  'Segure para confirmar': 'Hold to confirm',
  'Tela cheia não suportada aqui': 'Full screen is not supported here',
  'No iPhone: Compartilhar → Adicionar à Tela de Início': 'On iPhone: Share → Add to Home Screen'
};
const t = s => (LANG === 'en' && EN[s]) || s;
document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-BR';
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.textContent.trim()); });
document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
$('lockedHelp').innerHTML = t('No PC, clique no ícone do <b>PC Deck</b> perto do relógio,<br>escolha <b>Conectar celular</b> e escaneie o QR code.');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

// ---------- token ----------
let token = new URLSearchParams(location.search).get('t');
if (token) { store.set('deck.t', token); history.replaceState(null, '', '/'); }
else token = store.get('deck.t');

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'X-Token': token || '', 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401) { $('locked').classList.add('show'); throw new Error(t('Sem acesso')); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || (t('Erro') + ' ' + r.status));
  return j;
}

function buzz(ms = 12) { if (navigator.vibrate) navigator.vibrate(ms); }

let toastT;
function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('bad', !!bad);
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- relogio ----------
function tick() {
  const d = new Date();
  $('time').textContent = d.toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' });
  const ds = d.toLocaleDateString(LOCALE, { weekday: 'short', day: '2-digit', month: 'short' }).replace(/\./g, '');
  $('date').textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
}
tick(); setInterval(tick, 1000);

// ---------- config / paginas ----------
let config = null;
let page = +(store.get('deck.page') || 0);

async function loadConfig() {
  config = await api('/api/config');
  document.title = config.title || 'PC Deck';
  const root = document.documentElement.style;
  root.setProperty('--cols', config.columns || 3);
  root.setProperty('--cols-l', config.columnsLandscape || 5);
  if (page >= config.pages.length) page = 0;
  renderTabs();
  renderGrid();
}

function renderTabs() {
  const nav = $('tabs');
  nav.innerHTML = '';
  config.pages.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = i === page ? 'on' : '';
    b.innerHTML = `<span class="ms">${p.icon || 'grid_view'}</span><span></span>`;
    b.lastChild.textContent = p.name;
    b.onclick = () => goPage(i);
    nav.appendChild(b);
  });
}

function goPage(i) {
  if (!config || i === page || i < 0 || i >= config.pages.length) return;
  const rev = i < page;
  page = i;
  store.set('deck.page', i);
  buzz(8);
  renderTabs();
  renderGrid(rev);
}

function renderGrid(rev) {
  const grid = $('grid');
  grid.innerHTML = '';
  (config.pages[page].buttons || []).forEach((btn, i) => grid.appendChild(makeTile(btn, i)));
  grid.classList.remove('in', 'rev');
  void grid.offsetWidth;
  grid.classList.add('in');
  if (rev) grid.classList.add('rev');
  $('gridwrap').scrollTop = 0;
}

function makeTile(btn, idx) {
  const el = document.createElement('button');
  el.className = 'tile';
  if (btn.color) el.style.setProperty('--c', btn.color);
  el.innerHTML = `<span class="fill"></span><span class="ico"><span class="ms">${btn.icon || 'radio_button_unchecked'}</span></span><span class="lbl"></span>`;
  el.querySelector('.lbl').textContent = btn.label || '';
  if (btn.confirm) el.insertAdjacentHTML('beforeend', '<span class="ms lock">touch_app</span>');

  const pg = page;
  let holdT = null, fired = false;
  el.addEventListener('pointerdown', () => {
    el.classList.add('down');
    buzz(10);
    if (btn.confirm) {
      fired = false;
      el.classList.add('hold');
      holdT = setTimeout(() => { fired = true; el.classList.remove('hold'); press(btn, pg, idx, el); }, 700);
    }
  });
  const release = cancel => {
    el.classList.remove('down');
    if (btn.confirm) {
      clearTimeout(holdT);
      el.classList.remove('hold');
      if (!fired && !cancel) toast(t('Segure para confirmar'));
    }
  };
  el.addEventListener('pointerup', () => release(false));
  el.addEventListener('pointerleave', () => release(true));
  el.addEventListener('pointercancel', () => release(true));
  el.addEventListener('click', () => { if (!btn.confirm) press(btn, pg, idx, el); });
  el.addEventListener('contextmenu', e => e.preventDefault());
  return el;
}

async function press(btn, pg, idx, el) {
  const actions = btn.actions || (btn.action ? [btn.action] : []);
  const nav = actions.find(a => a.type === 'page');
  const remote = actions.some(a => a.type !== 'page');
  try {
    if (remote) await api('/api/press', { page: pg, button: idx });
    el.classList.remove('ok'); void el.offsetWidth; el.classList.add('ok');
    if (btn.confirm) buzz([20, 40, 20]);
    if (nav) {
      const to = config.pages.findIndex(p => p.name === nav.to);
      if (to >= 0) goPage(to);
    }
    if (remote) setTimeout(poll, 250);
  } catch (e) {
    el.classList.remove('err'); void el.offsetWidth; el.classList.add('err');
    buzz([30, 50, 30]);
    toast(e.message, true);
  }
}

// deslizar para trocar de pagina
let sx = 0, sy = 0;
$('gridwrap').addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$('gridwrap').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 50) goPage(page + (dx < 0 ? 1 : -1));
}, { passive: true });

// ---------- midia e volume ----------
document.querySelectorAll('[data-media]').forEach(b => b.addEventListener('click', async () => {
  buzz(10);
  try { await api('/api/media', { cmd: b.dataset.media }); setTimeout(poll, 300); }
  catch (e) { toast(e.message, true); }
}));

const vol = $('vol');
let dragging = false, volT = null, lastSent = -1;
function paintVol(v) { vol.value = v; vol.style.setProperty('--p', v + '%'); $('volv').textContent = v; }
vol.addEventListener('pointerdown', () => dragging = true);
['pointerup', 'pointercancel'].forEach(ev => vol.addEventListener(ev, () => { dragging = false; sendVol(true); }));
vol.addEventListener('input', () => { paintVol(+vol.value); sendVol(false); });
function sendVol(now) {
  clearTimeout(volT);
  volT = setTimeout(() => {
    const v = +vol.value;
    if (v === lastSent) return;
    lastSent = v;
    api('/api/volume', { set: v }).catch(e => toast(e.message, true));
  }, now ? 0 : 70);
}
$('mute').addEventListener('click', async () => {
  buzz(10);
  try { const r = await api('/api/volume', { mute: 'toggle' }); paintMute(r.muted); }
  catch (e) { toast(e.message, true); }
});
function paintMute(m) {
  $('mute').classList.toggle('on', !!m);
  $('muteico').textContent = m ? 'volume_off' : 'volume_up';
}

// ---------- player ----------
// aparece so enquanto toca; ao pausar fica mais um pouco para dar tempo de voltar a tocar.
// "showPlayer": false no config (Configuracoes do editor) desliga de vez.
const PLAYER_GRACE = 20000;
let playerOn = false, lastPlaying = 0;
function showPlayer(playing) {
  if (playing) lastPlaying = Date.now();
  const want = !!config && config.showPlayer !== false && (playing || Date.now() - lastPlaying < PLAYER_GRACE);
  if (want === playerOn) return;
  playerOn = want;
  $('app').classList.toggle('noplayer', !want);
  const now = document.querySelector('.now');
  now.classList.remove('pop');
  if (want) { void now.offsetWidth; now.classList.add('pop'); }
}

// ---------- estado ----------
let artKey = null, fails = 0, cfgv = null;
async function poll() {
  if (document.hidden || !config) return;
  try {
    const s = await api('/api/state');
    fails = 0;
    // config.json mudou (editor do PC): recarrega os botoes
    if (cfgv && s.cfgv !== cfgv) loadConfig().catch(() => {});
    cfgv = s.cfgv;
    // idioma trocado no editor do PC: recarrega a pagina no idioma novo
    if (s.lang && s.lang !== LANG) { location.reload(); return; }
    $('offline').classList.remove('show');
    $('cpu').textContent = s.cpu + '%'; $('cpub').style.width = s.cpu + '%';
    $('ram').textContent = s.ram + '%'; $('ramb').style.width = s.ram + '%';
    if (s.volume != null && !dragging) { paintVol(s.volume); lastSent = s.volume; }
    paintMute(s.muted);
    const m = s.media;
    showPlayer(m && m.playing);
    $('title').textContent = m && m.title ? m.title : t('Nada tocando');
    $('artist').textContent = m && m.artist ? m.artist : (m && m.app ? m.app.replace(/\.exe$/i, '') : '—');
    $('playico').textContent = m && m.playing ? 'pause' : 'play_arrow';
    const k = m && m.art;
    if (k !== artKey) {
      artKey = k;
      const url = k ? `/api/art?k=${k}&t=${encodeURIComponent(token)}` : '';
      $('art').style.backgroundImage = k ? `url("${url}")` : '';
      $('art').classList.toggle('has', !!k);
      $('bgart').style.backgroundImage = k ? `url("${url}")` : '';
    }
  } catch (e) {
    if (++fails >= 2) $('offline').classList.add('show');
  }
}
setInterval(poll, 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

// ---------- tela cheia ----------
$('fs').addEventListener('click', () => {
  const d = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (d.requestFullscreen) d.requestFullscreen().catch(() => toast(t('Tela cheia não suportada aqui')));
  else toast(t('No iPhone: Compartilhar → Adicionar à Tela de Início'));
});
document.addEventListener('fullscreenchange', () => {
  $('fs').firstChild.textContent = document.fullscreenElement ? 'fullscreen_exit' : 'fullscreen';
});

// ---------- inicio ----------
if (!token) $('locked').classList.add('show');
else loadConfig().then(poll).catch(e => {
  $('offline').classList.add('show');
  setTimeout(() => location.reload(), 4000);
});
// recarrega os botoes quando voltar pro app (pega edicoes do config.json)
document.addEventListener('visibilitychange', () => { if (!document.hidden && token) loadConfig().catch(() => {}); });
</script>
</body>
</html>
