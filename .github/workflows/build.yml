name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: powershell
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PCDeck-Setup
          path: dist/PCDeck-Setup.exe

      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PCDeck-Setup.exe
